<html>
    <style>
        #head{
        width:auto;
        height:90px;
        background-color: rgb(249, 232, 218);
        }
        .right{
            width: 500px;
            background-color: rgb(249, 232, 218);
            float:right;
        }
        .left{
            width: 1400px;
            background-color: rgb(249, 232, 218);
            float:left;
        }
        a{
            text-decoration: none;
        }
        .margin{
            left: 30px;
        }
        .size{
            width: 500px;
            height: 200px;
        }
        .igsize{
            width: 500px;
            height: 200px;
            float: right;
        }
    </style>
    <body>
        <div id="head">
            <br>
            <div class="right">
                <center><a href="login"><button>Create new account/Login</button></a></center>
            </div>
            <div class="left">
                <center>
                    <table>
                        <tr>
                            <td><center><a href="home">Home &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;</a></center></td>
                            <td><center><a href="about">About &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;</a></center></td>
                            <td><center><a href="categories">Categories &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;</a></center></td>
                            <td><center><a href="best">Best selling &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;</a></center></td>
                            <td><center><a href="author">Authors &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;</a></center></td>
                            <td><center><a href="shop">Shop &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;</a></center></td>
                            <td><center><a href="contact">Contact Us &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;</a></center></td>
                            <td><center><a href="admin">Admin &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;</a></center></td>
                        </tr>
                    </table>
                </center>
            </div>
        </div>
        <center><h1 style="font-family: 'Courier New', Courier, monospace; color: black; font-size:40;"><b>Welcome to Galaxy Bookstore</b></h1></center>
        {% for i in k%}
        <div class="igsize">
            <label for="input-file">Add book image</label>
            <input type="file" accept="image/jpeg, image/png, image/jpg" id="input-file"><br>
        </div> 
        <div class="size" style="margin-left: 40px;">
            <p>{{i.bname}}&nbsp;&nbsp;&nbsp;({{i.author}})</p>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;<p>Cost: Rs.{{i.price}}&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;In stock: {{i.qty}}</p>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;<a href="remove/{{i.id}}">Remove</a><br><a href="cart">Add to cart</a><br>
        </div>
        {% endfor %}
        
        <form style="margin-left: 40px;" action="boo">
            <label>Book name: </label><input type="text" placeholder="Book name" name="name">
            <label>Author: </label><input type="text" placeholder="Author name" name="auth">
            <label>Cost: </label><input type="number" placeholder="Cost" name="cost">
            <label>Qty: </label><input type="number" name="qty">
            <button>Add</button>
        </form>
    </body>
</html>

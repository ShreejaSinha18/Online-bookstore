{% load static %}
<html>
    <style>
        #view{
            width: 1500px;
            height: 715px;
            background-color:rgb(186, 156, 120) ;
        }
        .right{
            width: 500px;
            background-color: rgb(186, 156, 120);
            float:right;
        }
        .center{
            display: block;
            margin-top: auto;
            margin-bottom: auto;
            margin-left: auto;
            margin-right: auto;
            width:80%;
            height:90%;
        }
        .container {
            position: relative;
            text-align:center;
        }
        .centered {
            position: absolute;
            top: 40%;
            left: 50%;
            transform: translate(-50%, -50%);
        }
        .top{
            position: absolute;
            top: 40px;
            left: 450px;
        }
        a{
            text-decoration: none;
        }
    </style>
    <body>
        <div id="view" class="container">
            <img style="opacity: 0.5;" src="{% static 'bookl.jpg' %}" width="900px" height="500px" class="center">
            <div class="right">
                <center><p><a href="signup"><button style="background-color: lightgray;"><b>New account?&nbsp;Sign Up</b></button></a></p></center>
            </div>
            <div class="top" style="font-size: 80;">
                <table>
                    <tr>
                        <td><center><a href="home">Home &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;</a></center></td>
                        <td><center><a href="about">About &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;</a></center></td>
                        <td><center><a href="categories">Categories &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;</a></center></td>
                        <td><center><a href="best">Best selling &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;</a></center></td>
                        <td><center><a href="author">Authors &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;</a></center></td>
                        <td><center><a href="shop">Shop &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;</a></center></td>
                        <td><center><a href="contact">Contact Us &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;</a></center></td>
                        <td><center><a href="admin">Admin &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;</a></center></td>
                    </tr>
                </table>
            </div>
        </div>
        <table class="centered">
            {% for i in t%}
            <tr><td>{{i.name}}</td><td><a href="del/{{i.id}}">Delete</a></td></tr>
            {% endfor %}
        </table>
    </body>
</html>
